# Mobiari status page. Upptime: GitHub Actions checks every 5 minutes, incidents are
# GitHub issues, the site is published to GitHub Pages at status.mobiari.com.
# Docs: https://upptime.js.org/docs/configuration
owner: Develari
repo: status
user-agent: Develari

# Nothing here needs a secret; an empty list disables secret substitution.
secrets: []

assignees:
  - ari-rocha

sites:
  - name: API
    slug: api
    # Measured from Sao Paulo through Globalping: the GitHub runners are in the US, which
    # added 300-500 ms of distance to every number on the page.
    type: globalping
    location: sao paulo
    # Readiness, not just liveness: it answers 503 when the database is down.
    url: https://api.mobiari.com/health/ready
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Painel
    slug: painel
    type: globalping
    location: sao paulo
    url: https://app.mobiari.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Site
    slug: site
    type: globalping
    location: sao paulo
    url: https://mobiari.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

status-website:
  cname: status.mobiari.com
  name: Status do Mobiari
  logoUrl: https://mobiari.com/favicon.svg
  faviconSvg: https://mobiari.com/favicon.svg
  # Mobiari blue (#2D5BFF, as on mobiari.com) for the page chrome. Up/down/degraded keep their
  # green/red/yellow: those are signals, not branding.
  css: |
    :root {
      --body-background-color: #f4f6fd;
      --body-text-color: #0f1b3d;
      --nav-border-bottom-color: #dce3f7;
      --nav-current-border-bottom-color: #2d5bff;
      --card-border-color: #dce3f7;
      --error-button-border-color: #1b3fd6;
      --error-button-background-color: #2d5bff;
      --submit-button-border-color: #1b3fd6;
      --submit-button-background-color: #2d5bff;
    }
    .submit-button { background: #2d5bff; }
  introTitle: "**Status do Mobiari**"
  introMessage: Estado dos nossos serviços em tempo real. Quando há um incidente, ele aparece aqui e é atualizado até a resolução.
  navbar:
    - title: Status
      href: /
    - title: Mobiari
      href: https://mobiari.com
    - title: Central de ajuda
      href: https://docs.mobiari.com

